name: Daily Options Trader
on:
  schedule:
    # Runs every 3 hours, Monday through Friday
    - cron:  '0 */3 * * 1-5'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python algo_trader.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save memory cache
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sent_alerts.txt || true
          git commit -m "Update sent alerts cache" || echo "No changes to commit"
          git push
